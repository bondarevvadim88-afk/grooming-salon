<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ГрумПро — Панель управления</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#fff;--bg2:#f5f5f4;--bg3:#f0efed;
      --text:#1a1a18;--text2:#6b6b68;--text3:#9e9e9a;
      --border:rgba(0,0,0,.10);--border2:rgba(0,0,0,.18);
      --teal:#1D9E75;--teal-bg:#E1F5EE;--teal-dark:#0F6E56;
      --amber:#854F0B;--danger:#A32D2D;--danger-bg:#FCEBEB;
      --blue:#185FA5;--blue-bg:#E6F1FB;
      --purple:#534AB7;--purple-bg:#EEEDFE;
      --r:8px;--rl:12px;
      --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c2a;
      --text:#e8e8e4;--text2:#9e9e9a;--text3:#6b6b68;
      --border:rgba(255,255,255,.10);--border2:rgba(255,255,255,.18);
      --teal-bg:#04342C;
    }}
    body{font-family:var(--font);background:var(--bg3);color:var(--text);font-size:14px;min-height:100vh}

    /* ── Login ── */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .login-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:32px;width:100%;max-width:380px}
    .login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px}
    .login-logo .ico{width:40px;height:40px;border-radius:10px;background:var(--teal-bg);display:flex;align-items:center;justify-content:center}
    .login-logo span{font-size:18px;font-weight:500}
    .login-title{font-size:16px;font-weight:500;margin-bottom:4px;text-align:center}
    .login-sub{font-size:13px;color:var(--text2);margin-bottom:24px;text-align:center}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
    .field input{width:100%;padding:9px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border-color .15s}
    .field input:focus{border-color:var(--teal)}
    .btn-primary{width:100%;background:var(--teal);border:none;border-radius:var(--r);padding:10px;font-size:14px;font-weight:500;color:#fff;cursor:pointer;transition:opacity .15s;font-family:var(--font)}
    .btn-primary:hover{opacity:.9}
    .btn-primary:disabled{opacity:.4;cursor:not-allowed}
    .login-err{font-size:12px;color:var(--danger);margin-top:10px;text-align:center;min-height:18px}

    /* ── App layout ── */
    .app{display:flex;min-height:100vh}
    .sidebar{width:200px;flex-shrink:0;background:var(--bg);border-right:0.5px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
    .main{flex:1;min-width:0;padding:24px;overflow-y:auto}
    .s-logo{display:flex;align-items:center;gap:9px;padding:16px 16px 14px;border-bottom:0.5px solid var(--border)}
    .s-logo .ico{width:30px;height:30px;border-radius:8px;background:var(--teal-bg);display:flex;align-items:center;justify-content:center}
    .s-logo span{font-size:14px;font-weight:500}
    .s-user{padding:10px 16px;font-size:11px;background:var(--bg2);margin:8px;border-radius:var(--r);display:flex;align-items:center;justify-content:space-between}
    .s-user .role{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:500}
    .role-admin{background:var(--teal-bg);color:var(--teal-dark)}
    .role-master{background:var(--blue-bg);color:var(--blue)}
    .snav{padding:4px 0;flex:1}
    .snav a{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:13px;cursor:pointer;color:var(--text2);text-decoration:none;transition:background .12s,color .12s}
    .snav a:hover{background:var(--bg2);color:var(--text)}
    .snav a:focus{outline:2px solid var(--teal);outline-offset:-2px}
    .snav a.active{background:var(--teal-bg);color:var(--teal-dark);font-weight:500}
    .snav a i{font-size:16px;flex-shrink:0}
    .snav .sep{height:0.5px;background:var(--border);margin:6px 14px}
    .s-logout{padding:12px 16px;border-top:0.5px solid var(--border)}
    .s-logout button{width:100%;background:none;border:0.5px solid var(--border2);border-radius:var(--r);padding:7px;font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:6px}
    .s-logout button:hover{border-color:var(--danger);color:var(--danger)}

    /* ── Cards ── */
    .card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:14px}
    .card h3{font-size:13px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .topbar h2{font-size:17px;font-weight:500}
    .topbar .acts{display:flex;gap:8px}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
    .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
    @media(max-width:900px){.g2{grid-template-columns:1fr}}
    @media(max-width:700px){.g4{grid-template-columns:repeat(2,1fr)}}
    .mcard{background:var(--bg2);border-radius:var(--r);padding:12px 14px}
    .mcard .ml{font-size:11px;color:var(--text2);margin-bottom:4px}
    .mcard .mv{font-size:22px;font-weight:500}
    .ib{background:none;border:0.5px solid var(--border2);border-radius:var(--r);padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer;transition:border-color .12s,color .12s;display:inline-flex;align-items:center;gap:5px;font-family:var(--font)}
    .ib:hover{border-color:var(--teal);color:var(--teal-dark)}
    .badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
    .badge.confirmed{background:#E1F5EE;color:#085041}
    .badge.pending{background:#FAEEDA;color:#633806}
    .badge.cancelled{background:#FCEBEB;color:#791F1F}
    .badge.completed{background:#E6F1FB;color:#0C447C}
    .badge.inprog{background:#EEEDFE;color:#3C3489}
    .tbl{width:100%;border-collapse:collapse;font-size:12px}
    .tbl th{text-align:left;padding:6px 8px;font-size:11px;font-weight:500;color:var(--text2);border-bottom:0.5px solid var(--border)}
    .tbl td{padding:8px;border-bottom:0.5px solid var(--border);color:var(--text);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tbl tr:last-child td{border-bottom:none}
    .tbl tr:hover td{background:var(--bg2)}
    .ava{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:500;flex-shrink:0}
    .bar-wrap{margin-bottom:8px}
    .bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:3px}
    .bar-track{height:6px;background:var(--border);border-radius:3px}
    .bar-fill{height:6px;border-radius:3px}
    .tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:8px;background:var(--bg2);color:var(--text2);margin:2px 2px 0 0}
    .sched-wrap{overflow-x:auto}
    .sched-grid{display:grid;gap:3px}
    .sched-hdr{font-size:11px;font-weight:500;color:var(--text2);text-align:center;padding:4px;background:var(--bg2);border-radius:var(--r)}
    .sched-time{font-size:11px;color:var(--text3);text-align:right;padding:5px 6px 0 0}
    .sched-slot{border-radius:5px;padding:4px 5px;min-height:28px;font-size:10px;cursor:pointer;border:0.5px solid transparent;transition:all .12s}
    .sched-slot.free{background:var(--bg2)}
    .sched-slot.free:hover{border-color:var(--teal);background:var(--teal-bg)}
    .sched-slot.booked{background:var(--teal-bg);color:#085041;border-color:#9FE1CB}
    .sched-slot.wait{background:#FAEEDA;color:#633806;border-color:#FAC775}
    .sched-slot.done{background:#E6F1FB;color:#0C447C;border-color:#B5D4F4}
    .filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
    .filter-row select,.filter-row input{font-size:12px;padding:5px 8px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-family:var(--font)}
    .filter-row input{flex:1;min-width:140px}
    .toggle{position:relative;width:30px;height:17px;display:inline-block}
    .toggle input{opacity:0;width:0;height:0;position:absolute}
    .tslider{position:absolute;inset:0;border-radius:9px;background:var(--border2);cursor:pointer;transition:.2s}
    .tslider::before{content:'';position:absolute;width:13px;height:13px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.2s}
    .toggle input:checked+.tslider{background:var(--teal)}
    .toggle input:checked+.tslider::before{transform:translateX(13px)}
    .svc-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid var(--border);gap:10px}
    .svc-row:last-child{border-bottom:none}
    .tl-item{position:relative;padding:0 0 12px 16px;border-left:0.5px solid var(--border)}
    .tl-item:last-child{border-left:0.5px solid transparent;padding-bottom:0}
    .tl-dot{position:absolute;left:-5px;top:3px;width:9px;height:9px;border-radius:50%;border:0.5px solid var(--border);background:var(--bg)}
    .tl-dot.ok{background:var(--teal);border-color:var(--teal)}
    .stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:12px}
    .stat-row:last-child{border-bottom:none}
    .alert{background:var(--danger-bg);color:var(--danger);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:12px}
    .loader{display:flex;align-items:center;justify-content:center;padding:40px}
    .spinner{width:24px;height:24px;border:3px solid var(--teal-bg);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Schedule editor ── */
    .day-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:0.5px solid var(--border)}
    .day-row:last-child{border-bottom:none}
    .day-name{width:36px;font-size:12px;font-weight:500;color:var(--text)}
    .day-times{display:flex;gap:8px;align-items:center;flex:1;flex-wrap:wrap}
    .day-times input[type=time]{padding:4px 6px;border:0.5px solid var(--border2);border-radius:var(--r);font-size:12px;background:var(--bg);color:var(--text);font-family:var(--font)}
    .day-times input[type=time]:disabled{opacity:.4}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
    .modal{background:var(--bg);border-radius:var(--rl);padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
    .modal h3{font-size:15px;font-weight:500;margin-bottom:16px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .btn-save{background:var(--teal);border:none;border-radius:var(--r);padding:8px 20px;font-size:13px;font-weight:500;color:#fff;cursor:pointer;font-family:var(--font)}
    .btn-cancel{background:none;border:0.5px solid var(--border2);border-radius:var(--r);padding:8px 16px;font-size:13px;color:var(--text2);cursor:pointer;font-family:var(--font)}
  </style>
</head>
<body>

<!-- ── Login screen ── -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="ico"><i class="ti ti-scissors" style="font-size:18px;color:#0F6E56" aria-hidden="true"></i></div>
      <span>ГрумПро</span>
    </div>
    <div class="login-title">Вход в панель управления</div>
    <div class="login-sub">Введите email и пароль</div>
    <div class="field">
      <label>Email</label>
      <input id="login-email" type="email" placeholder="admin@lyubi-grooming.ru" autocomplete="email">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Войти</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ── App screen ── -->
<div id="app-screen" class="app" style="display:none">
  <aside class="sidebar">
    <div class="s-logo">
      <div class="ico" aria-hidden="true"><i class="ti ti-scissors" style="font-size:15px;color:#0F6E56"></i></div>
      <span>ГрумПро</span>
    </div>
    <div class="s-user">
      <span id="user-email" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px"></span>
      <span class="role" id="user-role-badge"></span>
    </div>
    <nav class="snav" id="sidebar-nav"></nav>
    <div class="s-logout">
      <button onclick="doLogout()"><i class="ti ti-logout" aria-hidden="true"></i> Выйти</button>
    </div>
  </aside>
  <main class="main" id="main-content" aria-live="polite"></main>
</div>

<!-- ── Schedule modal ── -->
<div id="schedule-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>Моё расписание</h3>
    <div id="schedule-editor"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSchedule()">Отмена</button>
      <button class="btn-save" onclick="saveSchedule()">Сохранить</button>
    </div>
  </div>
</div>

<script>
"use strict";

const API = 'https://grooming-salon-production.up.railway.app';
const AVA = [{bg:'#E1F5EE',tc:'#0F6E56'},{bg:'#E6F1FB',tc:'#185FA5'},{bg:'#EEEDFE',tc:'#534AB7'}];
const STATUS_LABEL = {confirmed:'Подтверждена',pending:'Ожидает',cancelled:'Отменена',completed:'Завершена',inprog:'В работе'};
const DAYS_RU = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const SCHED_TIMES = ['09:00','09:30','10:00','10:30','11:00','11:30','12:00','13:00','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];

// ── State ──
let AUTH = JSON.parse(localStorage.getItem('groomauth') || 'null');
let CACHE = { appointments:[], staff:[], services:[] };
let fMaster='all', fStatus='all', fSearch='';
let schedDate = new Date();

// ── Helpers ──
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function ava(idx,sz=20){const a=AVA[idx%AVA.length];return `<div class="ava" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;background:${a.bg};color:${a.tc}">${esc(AUTH?.user?.role)}</div>`}
function avaOf(name,idx,sz=20){const a=AVA[idx%AVA.length];const i=(name||'').split(' ').slice(0,2).map(w=>w[0]).join('');return `<div class="ava" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;background:${a.bg};color:${a.tc}">${esc(i)}</div>`}
function fmtDate(d){return new Date(d).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fmtTime(d){return new Date(d).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function setHTML(html){document.getElementById('main-content').innerHTML=html}
function showLoader(){setHTML('<div class="loader"><div class="spinner"></div></div>')}
function isAdmin(){return AUTH?.user?.role==='ADMIN'}

// ── API ──
async function apiFetch(path, opts={}){
  const headers = {'Content-Type':'application/json'};
  if(AUTH?.access_token) headers['Authorization'] = 'Bearer '+AUTH.access_token;
  const r = await fetch(API+path, {...opts, headers:{...headers,...(opts.headers||{})}});
  if(r.status===401){doLogout();throw new Error('Сессия истекла')}
  if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||'Ошибка '+r.status)}
  return r.json();
}

// ── Auth ──
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const err   = document.getElementById('login-err');
  const btn   = document.getElementById('login-btn');
  if(!email||!pass){err.textContent='Введите email и пароль';return;}
  btn.disabled=true; btn.textContent='Вход…'; err.textContent='';
  try {
    const data = await fetch(API+'/auth/login',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password:pass})
    }).then(r=>r.json());
    if(!data.access_token) throw new Error(data.message||'Ошибка входа');
    AUTH = data;
    localStorage.setItem('groomauth', JSON.stringify(AUTH));
    showApp();
  } catch(e){
    err.textContent = e.message||'Неверный email или пароль';
    btn.disabled=false; btn.textContent='Войти';
  }
}

function doLogout(){
  AUTH=null; localStorage.removeItem('groomauth');
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-password').value='';
  document.getElementById('login-err').textContent='';
  document.getElementById('login-btn').disabled=false;
  document.getElementById('login-btn').textContent='Войти';
}

// ── App init ──
async function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='flex';
  document.getElementById('user-email').textContent = AUTH.user.email;
  const rb = document.getElementById('user-role-badge');
  rb.textContent = isAdmin() ? 'Администратор' : 'Мастер';
  rb.className = 'role ' + (isAdmin() ? 'role-admin' : 'role-master');
  buildNav();
  await loadData();
  navTo('dash', document.querySelector('.snav a.active'));
}

function buildNav(){
  const nav = document.getElementById('sidebar-nav');
  const adminLinks = [
    {id:'dash',   icon:'ti-layout-dashboard', label:'Дашборд'},
    {id:'sched',  icon:'ti-calendar',          label:'Расписание'},
    {id:'hist',   icon:'ti-clock-history',     label:'История'},
    {sep:true},
    {id:'masters',icon:'ti-users',             label:'Мастера'},
    {id:'svcs',   icon:'ti-cut',               label:'Услуги'},
    {sep:true},
    {id:'notif',  icon:'ti-bell',              label:'Уведомления'},
  ];
  const masterLinks = [
    {id:'my-sched', icon:'ti-calendar',        label:'Моё расписание'},
    {id:'my-appts', icon:'ti-clock-history',   label:'Мои записи'},
  ];
  const links = isAdmin() ? adminLinks : masterLinks;
  nav.innerHTML = links.map((l,i)=>{
    if(l.sep) return '<div class="sep" role="separator"></div>';
    const active = i===0 ? ' active' : '';
    return `<a class="${active}" tabindex="0" role="button"
      onclick="navTo('${l.id}',this)"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navTo('${l.id}',this)}">
      <i class="ti ${l.icon}" aria-hidden="true"></i>${esc(l.label)}
    </a>`;
  }).join('');
}

async function loadData(){
  try {
    const [appts, staff, services] = await Promise.all([
      apiFetch('/appointments').catch(()=>[]),
      apiFetch('/staff').catch(()=>[]),
      apiFetch('/services').catch(()=>[]),
    ]);
    CACHE.appointments = Array.isArray(appts) ? appts : [];
    CACHE.staff = Array.isArray(staff) ? staff : [];
    CACHE.services = Array.isArray(services) ? services : [];
  } catch(e){ console.error('loadData error', e); }
}

function navTo(page, el){
  document.querySelectorAll('.snav a').forEach(a=>a.classList.remove('active'));
  if(el) el.classList.add('active');
  try {
    const pages = {
      dash: renderDash, sched: renderSched, hist: renderHist,
      masters: renderMasters, svcs: renderSvcs, notif: renderNotif,
      'my-sched': renderMySchedule, 'my-appts': renderMyAppts,
    };
    (pages[page]||renderDash)();
  } catch(e){
    setHTML(`<div class="alert">Ошибка: ${esc(e.message)}</div>`);
    console.error(e);
  }
}

// ══════════════════════════════════════════
// ADMIN VIEWS
// ══════════════════════════════════════════

function renderDash(){
  const today = new Date().toLocaleDateString('ru-RU');
  const todayA = CACHE.appointments.filter(a=>fmtDate(a.startAt)===today);
  const dayRev = todayA.filter(a=>['completed','inprog'].includes(a.status)).reduce((s,a)=>s+a.totalPrice,0);
  const monthRev = CACHE.appointments.reduce((s,a)=>s+a.totalPrice,0);
  const noPct = CACHE.appointments.length ? Math.round(CACHE.appointments.filter(a=>a.status==='cancelled').length/CACHE.appointments.length*100) : 0;

  setHTML(`
  <div class="topbar"><h2>Дашборд</h2>
    <div class="acts"><button class="ib" onclick="loadData().then(renderDash)"><i class="ti ti-refresh" aria-hidden="true"></i> Обновить</button></div>
  </div>
  <div class="g4">

function renderSched(){
  const todayStr = new Date().toLocaleDateString('ru-RU');
  const todayA = CACHE.appointments.filter(a=>fmtDate(a.startAt)===todayStr);
  const cols = `64px repeat(${CACHE.staff.length},1fr)`;
  setHTML(`
  <div class="topbar"><h2>Расписание — сегодня</h2></div>
  <div class="card">
    <div class="sched-wrap">
      <div class="sched-grid" style="grid-template-columns:${cols}">
        <div class="sched-hdr"></div>
        ${CACHE.staff.map((m,i)=>`<div class="sched-hdr"><div style="display:flex;align-items:center;justify-content:center;gap:5px">${avaOf(m.name,i,22)}<span>${esc(m.name.split(' ')[0])}</span></div></div>`).join('')}
        ${SCHED_TIMES.map(t=>`
          <div class="sched-time">${t}</div>
          ${CACHE.staff.map(m=>{
            const a=todayA.find(x=>fmtTime(x.startAt)===t&&x.staffId===m.id);
            if(a){const cls=a.status==='pending'?'wait':a.status==='completed'?'done':'booked';
              return `<div class="sched-slot ${cls}" title="${esc(a.client?.name)} — ${esc(a.service?.name)}"><div style="font-weight:500">${esc(a.pet?.name||'—')}</div><div style="opacity:.8;font-size:9px">${esc(a.service?.name||'')}</div></div>`;}
            return `<div class="sched-slot free"></div>`;
          }).join('')}
        `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
      ${[['booked','Подтверждено'],['wait','Ожидает'],['done','Завершено']].map(([c,l])=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)"><div class="sched-slot ${c}" style="width:14px;height:14px;min-height:0;flex-shrink:0"></div>${l}</div>`).join('')}
    </div>
  </div>`);
}

function getFiltered(){
  return CACHE.appointments.filter(a=>{
    if(fMaster!=='all'&&a.staffId!==fMaster)return false;
    if(fStatus!=='all'&&a.status!==fStatus)return false;
    if(fSearch){const q=fSearch.toLowerCase();if(!(a.client?.name||'').toLowerCase().includes(q)&&!(a.pet?.name||'').toLowerCase().includes(q))return false;}
    return true;
  });
}

function renderHistRow(a){
  const si=CACHE.staff.findIndex(x=>x.id===a.staffId);
  return `<tr>
    <td style="color:var(--text2)">${fmtDate(a.startAt)}<div style="font-size:10px">${fmtTime(a.startAt)}</div></td>
    <td><div style="font-weight:500">${esc(a.client?.name||'—')}</div><div style="font-size:10px;color:var(--text2)">${esc(a.pet?.name||'—')}</div></td>
    <td><div style="display:flex;align-items:center;gap:4px">${avaOf(a.staff?.name||'',si,18)}<span style="font-size:10px">${esc((a.staff?.name||'').split(' ')[0])}</span></div></td>
    <td style="font-size:11px">${esc(a.service?.name||'—')}</td>
    <td style="font-weight:500">${(a.totalPrice||0).toLocaleString('ru-RU')} ₽</td>
    <td><span class="badge ${a.status}">${STATUS_LABEL[a.status]||a.status}</span></td>
  </tr>`;
}

function updateHistTable(){
  const filtered=getFiltered();

  if(tb)tb.innerHTML=filtered.map(renderHistRow).join('');
  if(ct)ct.textContent=`Показано: ${filtered.length} из ${CACHE.appointments.length}`;
}

// ── Schedule editor for masters ──
let scheduleData = {};

function renderMySchedule(){
  const myStaff = CACHE.staff.find(s=>s.id===AUTH?.user?.staffId);
  if(!myStaff){setHTML('<div class="alert">Профиль мастера не найден</div>');return;}

  // Build schedule from workSchedules
  scheduleData = {};
  (myStaff.workSchedules||[]).forEach(ws=>{
    scheduleData[ws.dayOfWeek] = {isWorking:ws.isWorking, startTime:ws.startTime, endTime:ws.endTime};
  });

  const today = new Date().toLocaleDateString('ru-RU');
  const myAppts = getMyAppts().filter(a=>fmtDate(a.startAt)===today);

  setHTML(`
  <div class="topbar">
    <h2>Моё расписание</h2>
    <div class="acts">
      <button class="ib" onclick="openScheduleEditor()"><i class="ti ti-edit" aria-hidden="true"></i> Изменить расписание</button>
    </div>
  </div>
  <div class="card">
    <h3><i class="ti ti-clock" style="color:var(--teal)" aria-hidden="true"></i> Текущее расписание</h3>
    ${[1,2,3,4,5,6,7].map(d=>{
      const ws=scheduleData[d]||{isWorking:false,startTime:'09:00',endTime:'18:00'};
      return `<div class="day-row">
        <div class="day-name">${DAYS_RU[d-1]}</div>
        <div style="flex:1;font-size:12px;color:${ws.isWorking?'var(--text)':'var(--text3)'}">
          ${ws.isWorking?`${ws.startTime} — ${ws.endTime}`:'Выходной'}
        </div>
        <span class="badge ${ws.isWorking?'confirmed':'cancelled'}">${ws.isWorking?'Работает':'Выходной'}</span>
      </div>`;
    }).join('')}
  </div>
  <div class="card">
    <h3><i class="ti ti-calendar" style="color:var(--teal)" aria-hidden="true"></i> Мои записи сегодня</h3>
    ${myAppts.length===0?'<div style="color:var(--text3);font-size:13px">Записей нет</div>':''}
    <table class="tbl">
      <thead><tr><th>Время</th><th>Клиент</th><th>Питомец</th><th>Услуга</th><th>Статус</th></tr></thead>
      <tbody>${myAppts.map(a=>`<tr>
        <td style="font-weight:500">${fmtTime(a.startAt)}</td>
        <td>${esc(a.client?.name||'—')}<div style="font-size:10px;color:var(--text2)">${esc(a.client?.phone||'')}</div></td>
        <td>${esc(a.pet?.name||'—')}</td>
        <td style="font-size:11px">${esc(a.service?.name||'—')}</td>
        <td><span class="badge ${a.status}">${STATUS_LABEL[a.status]||a.status}</span></td>
      </tr>`).join('')}</tbody>
    </table>
  </div>`);
}

function openScheduleEditor(){
  const editor = document.getElementById('schedule-editor');
  editor.innerHTML = [1,2,3,4,5,6,7].map(d=>{
    const ws=scheduleData[d]||{isWorking:false,startTime:'09:00',endTime:'18:00'};
    return `<div class="day-row">
      <div class="day-name">${DAYS_RU[d-1]}</div>
      <div class="day-times">
        <label class="toggle" aria-label="${DAYS_RU[d-1]} рабочий день">
          <input type="checkbox" id="wd-${d}" ${ws.isWorking?'checked':''} onchange="toggleDay(${d})">
          <span class="tslider"></span>
        </label>
        <input type="time" id="ws-${d}" value="${ws.startTime}" ${ws.isWorking?'':'disabled'}>
        <span style="font-size:12px;color:var(--text3)">—</span>
        <input type="time" id="we-${d}" value="${ws.endTime}" ${ws.isWorking?'':'disabled'}>
      </div>
    </div>`;
  }).join('');
  document.getElementById('schedule-modal').style.display='flex';
}

function toggleDay(d){
  const checked = document.getElementById(`wd-${d}`).checked;
  document.getElementById(`ws-${d}`).disabled = !checked;
  document.getElementById(`we-${d}`).disabled = !checked;
}

function closeSchedule(){
  document.getElementById('schedule-modal').style.display='none';
}

async function saveSchedule(){
  const staffId = AUTH?.user?.staffId;
  if(!staffId){alert('Профиль мастера не найден');return;}
  const schedule = [1,2,3,4,5,6,7].map(d=>({
    dayOfWeek: d,
    isWorking: document.getElementById(`wd-${d}`).checked,
    startTime: document.getElementById(`ws-${d}`).value || '09:00',
    endTime:   document.getElementById(`we-${d}`).value || '18:00',
  }));
  try {
    await apiFetch(`/staff/${staffId}/schedule`,{
      method:'PUT',
      body: JSON.stringify({schedule}),
    });
    closeSchedule();
    await loadData();
    renderMySchedule();
  } catch(e){
    alert('Ошибка сохранения: '+e.message);
  }
}

// ── Boot ──
if(AUTH?.access_token){
  showApp();
} else {
  document.getElementById('login-screen').style.display='flex';
}
