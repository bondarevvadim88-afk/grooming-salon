<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ГрумПро — административная панель управления записями, мастерами и услугами">
  <title>ГрумПро — Административная панель</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* FIX #3 — sr-only was used but never defined */
    .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
    :root {
      --bg:#fff; --bg2:#f5f5f4; --bg3:#f0efed;
      --text:#1a1a18; --text2:#6b6b68; --text3:#9e9e9a;
      --border:rgba(0,0,0,.10); --border2:rgba(0,0,0,.20);
      --teal:#1D9E75; --teal-bg:#E1F5EE; --teal-dark:#0F6E56;
      --amber:#854F0B; --amber-bg:#FAEEDA;
      --blue:#185FA5; --blue-bg:#E6F1FB;
      --purple:#534AB7; --purple-bg:#EEEDFE;
      --danger:#A32D2D; --danger-bg:#FCEBEB;
      --r:8px; --rl:12px;
      --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c2a;
      --text:#e8e8e4;--text2:#9e9e9a;--text3:#6b6b68;
      --border:rgba(255,255,255,.10);--border2:rgba(255,255,255,.18);
      --teal-bg:#04342C;
    }}
    body{font-family:var(--font);background:var(--bg3);color:var(--text);font-size:14px;min-height:100vh}
    .app{display:flex;min-height:100vh}
    .sidebar{width:200px;flex-shrink:0;background:var(--bg);border-right:.5px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
    .main{flex:1;min-width:0;padding:24px;overflow-y:auto}
    .s-logo{display:flex;align-items:center;gap:9px;padding:16px 16px 14px;border-bottom:.5px solid var(--border)}
    .s-logo .ico{width:30px;height:30px;border-radius:8px;background:var(--teal-bg);display:flex;align-items:center;justify-content:center}
    .s-logo span{font-size:14px;font-weight:500}
    .snav{padding:8px 0;flex:1}
    /* FIX #5 — keyboard nav via tabindex + onkeydown */
    .snav a{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:13px;cursor:pointer;color:var(--text2);text-decoration:none;transition:background .12s,color .12s}
    .snav a:hover{background:var(--bg2);color:var(--text)}
    .snav a:focus{outline:2px solid var(--teal);outline-offset:-2px}
    .snav a.active{background:var(--teal-bg);color:var(--teal-dark);font-weight:500}
    .snav a i{font-size:16px;flex-shrink:0}
    .snav .sep{height:.5px;background:var(--border);margin:6px 14px}
    .s-version{padding:10px 16px;font-size:11px;color:var(--text3)}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .topbar h2{font-size:17px;font-weight:500}
    .topbar .acts{display:flex;gap:8px}
    .card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:14px}
    .card h3{font-size:13px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
    .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
    @media(max-width:900px){.g2{grid-template-columns:1fr}}
    @media(max-width:700px){.g4{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:480px){.g4{grid-template-columns:1fr}.sidebar{width:56px}.s-logo span,.s-version{display:none}.snav a{padding:10px;justify-content:center}.snav a i{font-size:18px}.main{padding:12px}}
    .mcard{background:var(--bg2);border-radius:var(--r);padding:12px 14px}
    .mcard .ml{font-size:11px;color:var(--text2);margin-bottom:4px}
    .mcard .mv{font-size:22px;font-weight:500}
    .mcard .md{font-size:11px;margin-top:2px}
    .ib{background:none;border:.5px solid var(--border2);border-radius:var(--r);padding:6px 12px;font-size:12px;color:var(--text2);cursor:pointer;transition:border-color .12s,color .12s;display:inline-flex;align-items:center;gap:5px}
    .ib:hover{border-color:var(--teal);color:var(--teal-dark)}
    .ib:focus{outline:2px solid var(--teal);outline-offset:2px}
    .badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
    .badge.confirmed{background:#E1F5EE;color:#085041}
    .badge.pending{background:#FAEEDA;color:#633806}
    .badge.cancelled{background:#FCEBEB;color:#791F1F}
    .badge.completed{background:#E6F1FB;color:#0C447C}
    .badge.inprog{background:#EEEDFE;color:#3C3489}
    .badge.delivered{background:#E1F5EE;color:#085041}
    .badge.failed{background:#FCEBEB;color:#791F1F}
    .tbl{width:100%;border-collapse:collapse;font-size:12px}
    .tbl th{text-align:left;padding:6px 8px;font-size:11px;font-weight:500;color:var(--text2);border-bottom:.5px solid var(--border)}
    .tbl td{padding:8px;border-bottom:.5px solid var(--border);color:var(--text);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tbl tr:last-child td{border-bottom:none}
    .tbl tr:hover td{background:var(--bg2)}
    .ava{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:500;flex-shrink:0}
    .bar-wrap{margin-bottom:8px}
    .bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:3px}
    .bar-track{height:6px;background:var(--border);border-radius:3px}
    .bar-fill{height:6px;border-radius:3px}
    .tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:8px;background:var(--bg2);color:var(--text2);margin:2px 2px 0 0}
    .sched-wrap{overflow-x:auto}
    /* FIX #12 — grid-template-columns set dynamically via JS */
    .sched-grid{display:grid;gap:3px}
    .sched-hdr{font-size:11px;font-weight:500;color:var(--text2);text-align:center;padding:4px;background:var(--bg2);border-radius:var(--r)}
    .sched-time{font-size:11px;color:var(--text3);text-align:right;padding:5px 6px 0 0}
    .sched-slot{border-radius:5px;padding:4px 5px;min-height:28px;font-size:10px;cursor:pointer;border:.5px solid transparent;transition:all .12s}
    .sched-slot.free{background:var(--bg2)}
    .sched-slot.free:hover{border-color:var(--teal);background:var(--teal-bg)}
    .sched-slot.booked{background:var(--teal-bg);color:#085041;border-color:#9FE1CB}
    .sched-slot.wait{background:#FAEEDA;color:#633806;border-color:#FAC775}
    .sched-slot.done{background:#E6F1FB;color:#0C447C;border-color:#B5D4F4}
    .filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
    .filter-row select,.filter-row input{font-size:12px;padding:5px 8px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text)}
    .filter-row input{flex:1;min-width:140px}
    .toggle{position:relative;width:30px;height:17px;display:inline-block}
    .toggle input{opacity:0;width:0;height:0;position:absolute}
    .tslider{position:absolute;inset:0;border-radius:9px;background:var(--border2);cursor:pointer;transition:.2s}
    .tslider::before{content:'';position:absolute;width:13px;height:13px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.2s}
    .toggle input:checked+.tslider{background:var(--teal)}
    .toggle input:checked+.tslider::before{transform:translateX(13px)}
    .svc-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:.5px solid var(--border);gap:10px}
    .svc-row:last-child{border-bottom:none}
    .tl-item{position:relative;padding:0 0 12px 16px;border-left:.5px solid var(--border)}
    .tl-item:last-child{border-left:.5px solid transparent;padding-bottom:0}
    .tl-dot{position:absolute;left:-5px;top:3px;width:9px;height:9px;border-radius:50%;border:.5px solid var(--border);background:var(--bg)}
    .tl-dot.ok{background:var(--teal);border-color:var(--teal)}
    .tl-dot.warn{background:#EF9F27;border-color:#EF9F27}
    .stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:.5px solid var(--border);font-size:12px}
    .stat-row:last-child{border-bottom:none}
    /* FIX #11 — removed unused .nch-badge */
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Боковая навигация">
    <div class="s-logo">
      <div class="ico" aria-hidden="true"><i class="ti ti-scissors" style="font-size:15px;color:var(--teal-dark)"></i></div>
      <span>ГрумПро</span>
    </div>
    <nav class="snav">
      <!-- FIX #5 — tabindex + role + onkeydown for keyboard navigation -->
      <a class="active" tabindex="0" role="button" onclick="nav('dash',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('dash',this)}">
        <i class="ti ti-layout-dashboard" aria-hidden="true"></i>Дашборд</a>
      <a tabindex="0" role="button" onclick="nav('sched',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('sched',this)}">
        <i class="ti ti-calendar" aria-hidden="true"></i>Расписание</a>
      <a tabindex="0" role="button" onclick="nav('hist',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('hist',this)}">
        <i class="ti ti-clock-history" aria-hidden="true"></i>История</a>
      <div class="sep" role="separator"></div>
      <a tabindex="0" role="button" onclick="nav('masters',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('masters',this)}">
        <i class="ti ti-users" aria-hidden="true"></i>Мастера</a>
      <a tabindex="0" role="button" onclick="nav('svcs',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('svcs',this)}">
        <i class="ti ti-cut" aria-hidden="true"></i>Услуги</a>
      <div class="sep" role="separator"></div>
      <a tabindex="0" role="button" onclick="nav('notif',this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();nav('notif',this)}">
        <i class="ti ti-bell" aria-hidden="true"></i>Уведомления</a>
    </nav>
    <div class="s-version">v1.1.0 · ГрумПро</div>
  </aside>
  <main class="main" id="main-content" aria-live="polite"></main>
</div>
<script>
"use strict";
// ── Data ──────────────────────────────────────────────────────────────
// ── DEMO MODE ─────────────────────────────────────────────────────────
// A8 fix: set IS_DEMO=false and remove DEMO_TODAY references for production
const IS_DEMO    = true;
const DEMO_TODAY = '14.05.2025';
// Production: const DEMO_TODAY = new Date().toLocaleDateString('ru-RU');
// ──────────────────────────────────────────────────────────────────────
let MASTERS = [

  {id:'am',ini:'АМ',n:'Алексей Морозов',sp:'Крупные и средние породы',  exp:'5 лет',rt:4.7,rv:98, active:true, bg:'#E6F1FB',tc:'#185FA5',tags:['Лабрадоры','Овчарки','Хаски'], sched:'Вт–Сб 10:00–20:00',visits:98, rev:176000,badge:null},
  {id:'ev',ini:'ЕВ',n:'Елена Васильева',sp:'SPA-уход, первый груминг',  exp:'6 лет',rt:4.8,rv:115,active:true, bg:'#EEEDFE',tc:'#534AB7',tags:['Йорки','Шпицы','Щенки'],       sched:'Пн–Пт 10:00–18:00',visits:115,rev:194000,badge:null},

let SVCS = [
  {id:'bath', ic:'ti-droplet',  n:'Купание',        d:'Шампунь, сушка, расчёска',     base:800, dur:60, active:true, coef:{small:.8,medium:1,large:1.5}},

  {id:'trim', ic:'ti-scissors', n:'Стрижка',        d:'Модельная или гигиеническая',   base:1200,dur:75, active:true, coef:{small:.8,medium:1,large:1.5}},

  {id:'spa',  ic:'ti-sparkles', n:'SPA-пакет',      d:'Маска, массаж, ароматизация',   base:1500,dur:90, active:true, coef:{small:.8,medium:1,large:1.5}},
  {id:'puppy',ic:'ti-star',     n:'Первый груминг', d:'Мягкое знакомство для щенков', base:600, dur:60, active:false,coef:{small:1, medium:1,large:1  }},
];
const APPTS = [
  {id:'A001',client:'Анна Смирнова',  phone:'+7 916 123-45-67',pet:'Бублик',breed:'Пудель',     sz:'small', svc:'Полный груминг',  mi:'МС',mn:'Мария Соколова', mbg:'#E1F5EE',mtc:'#0F6E56', date:DEMO_TODAY,  time:'10:00',price:1600,status:'inprog',   dur:120},
  {id:'A002',client:'Игорь Петров',   phone:'+7 903 234-56-78',pet:'Рекс',  breed:'Овчарка',   sz:'large', svc:'Купание',         mi:'АМ',mn:'Алексей Морозов',mbg:'#E6F1FB',mtc:'#185FA5',date:DEMO_TODAY,  time:'11:30',price:1200,status:'confirmed',dur:90},
  {id:'A003',client:'Светлана Ким',   phone:'+7 926 345-67-89',pet:'Муся',  breed:'Перс',      sz:'medium',svc:'Купание+стрижка', mi:'ЕВ',mn:'Елена Васильева',mbg:'#EEEDFE',mtc:'#534AB7',date:DEMO_TODAY,  time:'12:00',price:2000,status:'confirmed',dur:100},
  {id:'A004',client:'Дмитрий Орлов',  phone:'+7 999 456-78-90',pet:'Зефир', breed:'Шпиц',     sz:'small', svc:'Первый груминг',  mi:'ЕВ',mn:'Елена Васильева',mbg:'#EEEDFE',mtc:'#534AB7',date:DEMO_TODAY,  time:'14:00',price:480, status:'pending',  dur:60},
  {id:'A005',client:'Ольга Новак',    phone:'+7 905 567-89-01',pet:'Тедди', breed:'Лабрадор',  sz:'large', svc:'Полный груминг',  mi:'АМ',mn:'Алексей Морозов',mbg:'#E6F1FB',mtc:'#185FA5',date:DEMO_TODAY,  time:'15:00',price:3000,status:'confirmed',dur:150},
  {id:'A006',client:'Мария Зайцева',  phone:'+7 916 678-90-12',pet:'Кексик',breed:'Йорк',     sz:'small', svc:'SPA-пакет',       mi:'МС',mn:'Мария Соколова', mbg:'#E1F5EE',mtc:'#0F6E56', date:DEMO_TODAY,  time:'16:30',price:1200,status:'confirmed',dur:90},
  {id:'A007',client:'Никита Волков',  phone:'+7 929 789-01-23',pet:'Джек',  breed:'Хаски',    sz:'large', svc:'Стрижка когтей',  mi:'АМ',mn:'Алексей Морозов',mbg:'#E6F1FB',mtc:'#185FA5',date:'13.05.2025',time:'10:00',price:600, status:'completed',dur:30},
  {id:'A008',client:'Анна Смирнова',  phone:'+7 916 123-45-67',pet:'Бублик',breed:'Пудель',   sz:'small', svc:'Купание',         mi:'МС',mn:'Мария Соколова', mbg:'#E1F5EE',mtc:'#0F6E56', date:'01.05.2025',time:'11:00',price:640, status:'completed',dur:60},
  {id:'A009',client:'Светлана Ким',   phone:'+7 926 345-67-89',pet:'Муся',  breed:'Перс',     sz:'medium',svc:'SPA-пакет',       mi:'ЕВ',mn:'Елена Васильева',mbg:'#EEEDFE',mtc:'#534AB7',date:'22.04.2025',time:'13:00',price:1500,status:'completed',dur:90},
  {id:'A010',client:'Сергей Белов',   phone:'+7 911 890-12-34',pet:'Фокси', breed:'Фокстерьер',sz:'small',svc:'Стрижка',         mi:'МС',mn:'Мария Соколова', mbg:'#E1F5EE',mtc:'#0F6E56', date:'10.05.2025',time:'14:00',price:960, status:'cancelled',dur:60},
];
const NOTIF_TYPES=[
  {key:'BOOKING_CONFIRMED',label:'Подтверждение записи',channels:['SMS','Email','Telegram']},
  {key:'REMINDER_24H',     label:'Напоминание за 24 ч', channels:['SMS','Telegram','Push']},
  {key:'REMINDER_2H',      label:'Напоминание за 2 ч',  channels:['SMS','Push']},
  {key:'BOOKING_CANCELLED',label:'Отмена записи',       channels:['SMS','Email']},
  {key:'REVIEW_REQUEST',   label:'Запрос отзыва (+3 ч)', channels:['SMS','Telegram','VK']},
  {key:'BOOKING_CHANGED',  label:'Перенос записи',      channels:['SMS','Email','Telegram']},
];
const ALL_CHANNELS=['SMS','Email','Telegram','VK','MAX','Push'];
let notifState=JSON.parse(JSON.stringify(NOTIF_TYPES));
const STATUS_LABEL={confirmed:'Подтверждена',pending:'Ожидает',cancelled:'Отменена',completed:'Завершена',inprog:'В работе'};

// ── Filter & Schedule state ─────────────────────────────────────────
let fMaster='all',fStatus='all',fSearch='';
let schedDate=new Date(); // A7 fix: default to today

// ── Helpers ─────────────────────────────────────────────────────────
function ava(ini,bg,tc,sz=20){
  return `<div class="ava" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;background:${bg};color:${tc}">${ini}</div>`;
}
function calcPrice(base,coef,sz){
  return Math.round(base*(coef[sz]??1)/10)*10;
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(d){return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}

// ── Navigation ───────────────────────────────────────────────────────
function nav(page,el){
  document.querySelectorAll('.snav a').forEach(a=>a.classList.remove('active'));
  if(el)el.classList.add('active');
  const pages={dash:renderDash,sched:renderSched,hist:renderHist,masters:renderMasters,svcs:renderSvcs,notif:renderNotif};
  // A9 fix: try/catch prevents blank screen on render error
  try {
    document.getElementById('main-content').innerHTML=(pages[page]??renderDash)();
  } catch(err) {
    document.getElementById('main-content').innerHTML=`<div style="padding:24px;color:var(--danger)"><b>Ошибка рендера: ${err.message}</b><br><pre style="font-size:11px;margin-top:8px;opacity:.7">${err.stack}</pre></div>`;
    console.error('nav render error:', err);
  }
}

// ── DASHBOARD ────────────────────────────────────────────────────────
function renderDash(){
  const todayA=APPTS.filter(a=>a.date===DEMO_TODAY);
  const dayRev=todayA.filter(a=>a.status==='completed'||a.status==='inprog').reduce((s,a)=>s+a.price,0);
  const monthRev=APPTS.reduce((s,a)=>s+a.price,0);
  const noPct=Math.round(APPTS.filter(a=>a.status==='cancelled').length/APPTS.length*100);
  return `
  <div class="topbar"><h2>Дашборд</h2><div class="acts">
    <button class="ib"><i class="ti ti-refresh" aria-hidden="true"></i> Обновить</button>
    <button class="ib"><i class="ti ti-download" aria-hidden="true"></i> Отчёт</button>
  </div></div>
  <div class="g4">
    <div class="mcard"><div class="ml">Записей сегодня</div><div class="mv">${todayA.length}</div><div class="md" style="color:var(--teal-dark)"><i class="ti ti-trending-up" style="font-size:11px" aria-hidden="true"></i> +2 к вчера</div></div>
    <div class="mcard"><div class="ml">Выручка сегодня</div><div class="mv">${dayRev.toLocaleString('ru-RU')} ₽</div><div class="md" style="color:var(--teal-dark)"><i class="ti ti-trending-up" style="font-size:11px" aria-hidden="true"></i> +14%</div></div>
    <div class="mcard"><div class="ml">Выручка за месяц</div><div class="mv">${monthRev.toLocaleString('ru-RU')} ₽</div><div class="md" style="color:var(--text2)">план: 180 000 ₽</div></div>
    <div class="mcard"><div class="ml">% отмен / неявок</div><div class="mv">${noPct}%</div><div class="md" style="color:var(--amber)"><i class="ti ti-trending-down" style="font-size:11px" aria-hidden="true"></i> −2% к пр. нед.</div></div>
  </div>
  <div class="g2">
    <div class="card">
      <h3><i class="ti ti-calendar" style="font-size:15px;color:var(--teal)" aria-hidden="true"></i> Записи сегодня</h3>

const SCHED_TIMES=['09:00','09:30','10:00','10:30','11:00','11:30','12:00','13:00','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];

function renderSched(){
  const dateStr=fmtDate(schedDate);

  const cols=`64px repeat(${MASTERS.length},1fr)`;
  return `
  <div class="topbar">
    <h2>Расписание</h2>
    <div class="acts">
      <!-- FIX #13: prev/next now call schedNav() and actually re-render -->
      <button class="ib" onclick="schedNav(-1)"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
      <button class="ib" onclick="schedNav(0)">Сегодня</button>
      <button class="ib" onclick="schedNav(1)"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
    </div>
  </div>
  <div class="card">
    <div style="font-size:13px;font-weight:500;margin-bottom:10px;color:var(--text2)">
      ${schedDate.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
    </div>
    <div class="sched-wrap">
      <div class="sched-grid" style="grid-template-columns:${cols}">
        <div class="sched-hdr"></div>
        ${MASTERS.map(m=>`<div class="sched-hdr"><div style="display:flex;align-items:center;justify-content:center;gap:5px">${ava(m.ini,m.bg,m.tc,22)}<span>${esc(m.n.split(' ')[0])}</span></div></div>`).join('')}
        ${SCHED_TIMES.map(t=>`
          <div class="sched-time">${t}</div>
          ${MASTERS.map(m=>{
            const a=todayA.find(x=>x.time===t&&x.mi===m.ini);
            if(a){const cls=a.status==='pending'?'wait':a.status==='completed'?'done':'booked';
              return `<div class="sched-slot ${cls}" title="${esc(a.client)} — ${esc(a.svc)}"><div style="font-weight:500">${esc(a.pet)}</div><div style="opacity:.8;font-size:9px">${esc(a.svc)}</div></div>`;}
            return `<div class="sched-slot free" title="Свободно"></div>`;
          }).join('')}
        `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
      ${[['booked','Подтверждено / в работе'],['wait','Ожидает'],['done','Завершено']].map(([c,l])=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)"><div class="sched-slot ${c}" style="width:14px;height:14px;min-height:0;flex-shrink:0"></div>${l}</div>`).join('')}
    </div>
  </div>`;
}
function schedNav(dir){
  if(dir===0){schedDate=new Date();}
  else{schedDate=new Date(schedDate);schedDate.setDate(schedDate.getDate()+dir);}
  document.getElementById('main-content').innerHTML=renderSched();
}

// ── HISTORY ─────────────────────────────────────────────────────────
function getFiltered(){
  return APPTS.filter(a=>{
    if(fMaster!=='all'&&a.mi!==fMaster)return false;
    if(fStatus!=='all'&&a.status!==fStatus)return false;
    if(fSearch){const q=fSearch.toLowerCase();if(!a.client.toLowerCase().includes(q)&&!a.pet.toLowerCase().includes(q))return false;}
    return true;
  });
}
function renderHistRow(a){
  return `<tr>
    <td style="color:var(--text2)">${esc(a.date)}<div style="font-size:10px">${esc(a.time)}</div></td>
    <td><div style="font-weight:500">${esc(a.client)}</div><div style="font-size:10px;color:var(--text2)">${esc(a.pet)}, ${esc(a.breed)}</div></td>
    <td><div style="display:flex;align-items:center;gap:4px">${ava(a.mi,a.mbg,a.mtc,18)}<span style="font-size:10px">${esc(a.mn.split(' ')[0])}</span></div></td>
    <td style="font-size:11px">${esc(a.svc)}</td>
    <td style="font-weight:500">${a.price.toLocaleString('ru-RU')} ₽</td>
    <td><span class="badge ${a.status}">${STATUS_LABEL[a.status]??a.status}</span></td>
  </tr>`;
}
function renderHist(){
  const filtered=getFiltered();

    if(!clientMap[a.client])clientMap[a.client]={visits:0,total:0,pets:new Set(),last:''};
    clientMap[a.client].visits++;clientMap[a.client].total+=a.price;clientMap[a.client].pets.add(a.pet);clientMap[a.client].last=a.date;
  });
  return `
  <div class="topbar"><h2>История визитов</h2><div class="acts"><button class="ib"><i class="ti ti-download" aria-hidden="true"></i> Экспорт XLSX</button></div></div>

      <div class="filter-row">
        <!-- FIX #15: esc(fSearch) prevents XSS when value reflected in attribute -->
        <input type="search" placeholder="Поиск по клиенту, питомцу..." id="fsearch" value="${esc(fSearch)}" oninput="fSearch=this.value;updateHistTable()">
        <select id="fmaster" onchange="fMaster=this.value;updateHistTable()">
          <option value="all"${fMaster==='all'?' selected':''}>Все мастера</option>
          ${MASTERS.map(m=>`<option value="${esc(m.ini)}"${fMaster===m.ini?' selected':''}>${esc(m.n.split(' ')[0])}</option>`).join('')}
        </select>
        <select id="fstatus" onchange="fStatus=this.value;updateHistTable()">
          <option value="all"${fStatus==='all'?' selected':''}>Все статусы</option>
          ${Object.entries(STATUS_LABEL).map(([k,v])=>`<option value="${k}"${fStatus===k?' selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div style="overflow-x:auto">
        <table class="tbl" style="table-layout:fixed;min-width:480px">
          <colgroup><col style="width:80px"><col style="width:130px"><col style="width:90px"><col style="width:110px"><col style="width:75px"><col style="width:90px"></colgroup>
          <thead><tr><th>Дата</th><th>Клиент / питомец</th><th>Мастер</th><th>Услуга</th><th>Сумма</th><th>Статус</th></tr></thead>
          <tbody id="hist-tbody">${filtered.map(renderHistRow).join('')}</tbody>

      <div class="card">
        <h3><i class="ti ti-users" style="font-size:15px;color:var(--teal)" aria-hidden="true"></i> Постоянные клиенты</h3>
        ${Object.entries(clientMap).map(([name,d])=>`<div class="stat-row"><div><div style="font-size:12px;font-weight:500">${esc(name)}</div><div style="font-size:10px;color:var(--text2)">${[...d.pets].map(esc).join(', ')} · ${esc(d.last)}</div></div><div style="text-align:right"><div style="font-size:12px;font-weight:500">${d.total.toLocaleString('ru-RU')} ₽</div><div style="font-size:10px;color:var(--text2)">${d.visits} виз.</div></div></div>`).join('')}

        </div>
      </div>
    </div>
  </div>`;
}
function updateHistTable(){

}
function renderNotifRows(){
  return notifState.map((t,ti)=>`<tr><td style="font-size:11px;white-space:normal">${esc(t.label)}</td>${ALL_CHANNELS.map(ch=>{const on=t.channels.includes(ch);return`<td style="text-align:center"><span onclick="toggleNotif(${ti},'${ch}')" role="button" tabindex="0" style="cursor:pointer;display:inline-block" title="${on?'Отключить':'Включить'} ${ch}" onkeydown="if(event.key==='Enter')toggleNotif(${ti},'${ch}')"><i class="ti ${on?'ti-circle-check':'ti-circle-x'}" style="font-size:15px;color:${on?'#1D9E75':'var(--border2)'}" aria-hidden="true"></i></span></td>`;}).join('')}</tr>`).join('');
}
function toggleNotif(ti,ch){
  const idx=notifState[ti].channels.indexOf(ch);
  if(idx>=0)notifState[ti].channels.splice(idx,1);else notifState[ti].channels.push(ch);
  const tb=document.getElementById('notif-tbody');if(tb)tb.innerHTML=renderNotifRows();
}

// ── Boot ─────────────────────────────────────────────────────────────
nav('dash',document.querySelector('.snav a.active'));
</script>
</body>
</html>
